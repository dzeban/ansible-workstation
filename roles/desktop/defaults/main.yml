---
desktop_sway_packages:
  Fedora:
    - "@swaywm"
    - "@swaywm-extended"
  # TODO: Stub for Ubuntu 26.04. Extend after the first install.
  Ubuntu:
    - sway
    - swaybg
    - swayidle
    - swaylock
    - xdg-desktop-portal-wlr
    - xdg-desktop-portal-gtk
    - wl-clipboard
# swaywm-extended pulls sddm, greetd replaces it on hosts that select it.
desktop_sway_exclude:
  - sddm
  - sddm-wayland-sway

desktop_noctalia_deb_keyring: "https://pkg.noctalia.dev/deb/nickh-archive-keyring.deb"
desktop_noctalia_deb_sources: "https://pkg.noctalia.dev/deb/noctalia-{{ ansible_facts['distribution_release'] }}.sources"

desktop_locale:
  LANG: en_IE.UTF-8
  LC_TIME: en_DK.UTF-8

# Empty reuses whatever is set.
# "greetd" value is supported.
desktop_display_manager: ""
desktop_greetd_command: tuigreet --time --remember --remember-session --sessions /usr/share/wayland-sessions

desktop_custom_fonts_dir: "{{ ansible_facts['user_dir'] }}/.local/share/fonts"
desktop_custom_fonts:
  - name: "Hack Nerd Font"
    url: "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/Hack.zip"
    creates: "HackNerdFont-Regular.ttf"
