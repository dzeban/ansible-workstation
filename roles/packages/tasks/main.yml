---
- name: Install packages
  package:
    name: "{{ lookup('list', packages_system[ansible_facts['distribution']]) }}"
    state: latest
  become: yes

- block:
  - name: Install 3rd party packages from flathub
    become: yes
    block:
    - name: Install flatpak
      apt:
        name: flatpak
      when: ansible_facts['distribution'] == "Ubuntu"
      # On Fedora/RedHat it's installed by default

    - name: Add flathub remote
      flatpak_remote:
        name: flathub
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

    - name: Install flatpaks
      flatpak:
        name: "{{ item }}"
        remote: flathub
      loop: "{{ packages_flatpak }}"
      when:
  when: packages_flatpak is defined

- name: Install python packages
  command: uv tool install --upgrade {{ item }}
  loop: "{{ packages_python }}"
  when: ansible_facts['distribution'] != "Ubuntu"
  tags: python

- import_tasks: bin.yml
  when: packages_bin_binaries | length > 0
  tags: bin
